<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title description">
  <title id="title">Sportfoto kiezen</title>
  <desc id="description">Tijdelijke KNDSB-afbeelding die in Gutenberg kan worden vervangen.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#253780"/>
      <stop offset="1" stop-color="#101a4f"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#background)"/>
