  <circle cx="120" cy="840" r="330" fill="#f58220" opacity=".28"/>
  <text x="600" y="420" fill="#fff" font-family="Arial, sans-serif" font-size="58" font-weight="700" text-anchor="middle">KNDSB SPORTFOTO</text>
  <text x="600" y="492" fill="#fff" font-family="Arial, sans-serif" font-size="30" text-anchor="middle" opacity=".78">Vervang deze afbeelding in Gutenberg</text>
